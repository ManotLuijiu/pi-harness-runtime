name: Merge compatible dependency updates

on:
  pull_request_target:
    branches: [develop]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: dependency-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - name: Checkout trusted develop policy
        uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Capture the PR head before verifying metadata
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Verify Dependabot author and signed commits
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ github.token }}
      # No PR checkout, dependency install or PR script execution occurs.
      # Major updates and Pi API migrations are rejected by the policy.
      - name: Merge only compatible updates with passing exact-head checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ steps.head.outputs.sha }}
          DEPENDENCY_ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          DEPENDENCY_TARGET: ${{ steps.metadata.outputs.target-branch }}
          DEPENDENCY_UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          DEPENDENCY_MAINTAINER_CHANGES: ${{ steps.metadata.outputs.maintainer-changes }}
        run: node scripts/merge-dependency-pr.mjs
