# Merge a pull request - but only when every gate is green.
#
# The merge is done by this workflow, not by the auto merge of GitHub.
# The auto merge of GitHub merges a pull request as soon as it may, and
# "as soon as it may" is not "when the gates of this repository are
# green" - the gates of this repository are the required checks of the
# branch only when an administrator made them so. The merge here happens
# after the gates were read and found green, and the head commit that was
# checked is the head commit that is merged.
#
# The merge itself is the GraphQL mutation `mergePullRequest`. The REST
# endpoint of this repository answers 404 for a merge, with every token
# that was tried, while the mutation merges the same pull request - a
# workflow that used the endpoint never merged anything.
#
# The gates are the checks of the head commit of the pull request:
#
#   - "No sensitive terms" - the check that keeps a client name out of
#     the change. A change that holds a name is never merged.
#   - "Tests" - the CI of this repository.
#
# A name can carry more than one run. The push of the head commit and
# the pull request of its merge ref are both reported on that commit, and
# both are called "Tests": the first is the code of the branch, the
# second is the code that would land on the release branch. Every run of
# a required name counts.
#
# A run that is re-run keeps its number and gets a new attempt, and the
# attempt that failed stays on the commit. The newest attempt of a run is
# its state now, so the re-run of a failed job is what makes the gate
# green again.
#
# A pull request run of the CI that fails before a job starts reports no
# check run at all: the run exists, no job ran, and the API has nothing
# to report for it. Such a failure is on the side of GitHub and not on
# the side of the change - the same run re-run is green - and the gate
# does not hold the release for it, because a run without a check run is
# not a red check.
#
# The trigger is `pull_request_target`, so the workflow runs with the
# permissions of this repository. A normal pull request workflow gets a
# read only token for a fork, and a fork is where a pull request often
# comes from. The token of this workflow can merge, so the workflow must
# never run the code of the pull request. It therefore
#
#   - checks out the base branch, never the head of the pull request,
#   - persists no credential,
#   - reads the checks of the head commit through the API,
#   - runs nothing but the merger of the base branch.
#
# The script it runs is the one of the base branch, so a pull request
# cannot change the rule that judges it.
#
# A change from another repository is never merged by this workflow. The
# gates of this repository say nothing about what a stranger wrote, so
# such a pull request waits for a human.

name: Auto merge

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
    branches: [main]
  workflow_dispatch:
    inputs:
      open_release_pr:
        description: "Open the release pull request from develop into main"
        type: boolean
        default: false
      merge_now:
        description: >
          Merge the pull request in this run. When false, the run only
          opens the pull request, and the pull request event merges it.
        type: boolean
        default: true

# The workflow reads the checks of a commit and merges a pull request
# when they are green. It writes nothing else, apart from the pull
# request a manual run can ask for.
permissions:
  contents: read
  pull-requests: write
  checks: read

# One pull request, one run. A second push to the same pull request
# cancels the first run, so a queue of stale runs cannot delay the
# author.
concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge:
    name: Merge when every gate is green
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    # The merger waits for the checks of the head commit to finish. The
    # CI of this repository runs for minutes, so the wait is long.
    timeout-minutes: 30
    permissions:
      # The merge of a pull request writes to the repository. The job
      # runs the merger of the base branch and nothing of the pull
      # request, so the permission is only used for the merge itself.
      contents: write
      pull-requests: write
      checks: read
    steps:
      # The base branch. The head of the pull request is never checked
      # out - it would be untrusted code in a job that can merge.
      - name: Checkout the base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      # The merger is read from the checkout. If it is not there, the run
      # says so instead of failing with a module error.
      - name: The merger is there
        run: test -f scripts/auto-merge.mjs

      # The only step that decides. It reads the checks of the head
      # commit, waits for them to finish, and merges the pull request
      # when they are green. It runs no code of the pull request.
      - name: Merge or hold
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/auto-merge.mjs

  open-release-pr:
    name: Open the release pull request
    if: github.event_name == 'workflow_dispatch' && inputs.open_release_pr
    runs-on: ubuntu-latest
    # The job waits for the checks of the pull request, so it has to
    # outlive the CI of this repository.
    timeout-minutes: 45
    permissions:
      # The job merges the pull request it opened. The merge of a pull
      # request writes to the repository contents. The job runs the
      # merger of the branch it checked out and nothing of the pull
      # request, so the permission is only used for the merge itself.
      contents: write
      pull-requests: write
      checks: read
    steps:
      # The branch the release is prepared on. A manual run has no pull
      # request, so it has no base branch to check out.
      - name: Checkout the release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      # The release script opens the pull request with the token of the
      # machine, and a token of a machine does not always have the
      # permission to open a pull request. The token of a workflow has
      # it, so the pull request is opened here when a manual run asks
      # for it.
      #
      # Nothing of the pull request is run: only the name of the head
      # branch is used, and the pull request is judged by the gates of
      # the pull request event.
      - name: Open the release pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: develop
        run: |
          set -euo pipefail
          # The version of the release branch, not the version of the
          # checked out ref: the branch that is released carries the
          # version of the release, and the title has to name it.
          #
          # The manifest is read through the API, so nothing of the
          # release branch is checked out and nothing of it is run.
          manifest="repos/$GITHUB_REPOSITORY/contents/package.json"
          raw=$(gh api "$manifest?ref=$RELEASE_BRANCH" --jq '.content')
          version=$(printf '%s' "$raw" | tr -d '\n' | base64 -d \
            | node -e 'const fs=require("fs");
              const m=JSON.parse(fs.readFileSync(0,"utf8"));
              process.stdout.write(String(m.version||""));')
          if [ -z "$version" ]; then
            echo "the release branch carries no version" >&2
            exit 1
          fi
          open=$(gh pr list --base main --head develop --state open \
            --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "a pull request from develop into main is already open"
            number=$(gh pr list --base main --head develop --state open \
              --json number --jq '.[0].number')
            echo "number=$number" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          body="$RUNNER_TEMP/release-body.md"
          printf '%s\n' \
            "The release $version is prepared on \`develop\`." \
            '' \
            'This pull request is merged by the auto merge workflow' \
            'once the required checks pass. The tag is created on' \
            '`main` after the merge, and the tag is what publishes' \
            'to npm.' > "$body"
          gh pr create --base main --head develop \
            --title "Release $version" \
            --body-file "$body"
          number=$(gh pr list --base main --head develop --state open \
            --json number --jq '.[0].number')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # The gates are judged here as well.
      #
      # A pull request that a workflow opened does not start a workflow
      # of its own: an event that a token of the repository creates does
      # not create a run. The pull request event of the pull request
      # therefore never comes, and the merge job of the workflow never
      # runs for it. The manual run takes that work over: it reads the
      # checks of the head commit of the pull request and merges it when
      # they are green.
      #
      # A run that is told not to merge only opens the pull request. The
      # next push to the head branch is a push of a person, and that
      # push starts the pull request event, and the merge job of the
      # workflow merges the pull request with the script of the base
      # branch.
      - name: Merge or hold
        # The input is a boolean, so it is read as a boolean. A
        # comparison with the string 'false' would coerce the string to
        # a number, and the step would run either way.
        if: inputs.merge_now
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: node scripts/auto-merge.mjs
