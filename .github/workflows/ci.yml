name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          # No cache: project uses bun.lock (setup-node only
          # supports package-lock.json / yarn.lock).

      # Pinned: the harness test runner is validated against this version
      # (bun 1.3.14 has no node:sqlite, which the langchain daemon test needs).
      - name: Install bun
        run: npm install -g bun@1.3.14

      # The project uses bun.lock, not package-lock.json.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: node scripts/typecheck-packages.mjs

      # The published app is a SINGLE npm package. Every internal app
      # (logging, jev-judge, contracts, ...) is compiled into
      # packages/<name>/dist and shipped inside the root tarball. The build
      # must produce every published entry point, and the verifier proves the
      # tarball actually contains them.
      - name: Build packages
        run: bun scripts/build-packages.ts

      # The list of the client names makes the verifier look inside the
      # published files. Without it the scan is skipped, and the verifier
      # says so - the release workflow runs the same check on its own and
      # fails closed.
      #
      # A pull request from a fork gets no secret, and there the skip is
      # correct: the pull request workflow of the base branch holds the
      # secret and scans that pull request. Everywhere else - a push to
      # a branch of this repository, and a pull request from this
      # repository - a missing secret means the check silently turned
      # itself off. That fails here instead.
      - name: Verify package contents
        env:
          SENSITIVE_TERMS: ${{ secrets.SENSITIVE_TERMS }}
          SAME_REPOSITORY: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${SENSITIVE_TERMS:-}" ] && [ "$SAME_REPOSITORY" = "true" ]; then
            echo "SENSITIVE_TERMS is empty, so the published files were not checked."
            echo "The guard is off. Add the secret and run the workflow again."
            exit 1
          fi
          bun scripts/verify-package-contents.ts --pack

      # The root suite runs with bun (see scripts/run-root-tests.mjs): the
      # harness sources import each other with ".js" specifiers, and only bun
      # resolves those to the TypeScript sources. Node would need the
      # gitignored build artifacts, so a clean checkout cannot run it.
      - name: Run tests
        run: node scripts/run-root-tests.mjs

      # These two files also run under node, which exercises the node branch
      # of the TypeScript stripper (test/helpers/strip-types.mjs). The rest of
      # the suite needs the compiled artifacts, so it cannot run under node in
      # a clean checkout.
      - name: Run the node-compatible test files
        run: >
          node --test test/extension-syntax.test.mjs
          test/honcho-memory.test.mjs

      # Every test file that node can load also runs under node, which is the
      # runtime pi itself uses. The runner names the files it skips and the
      # reason for each, so a file that cannot run under node is visible
      # rather than silently missing.
      - name: Run the full node suite
        run: node scripts/run-node-tests.mjs

      - name: Run harness tests
        run: node scripts/run-langchain-tests.mjs

      # This suite resolves its TypeScript sources through bun, so it cannot
      # run under the node test runner.
      - name: Run autonomous-runtime inbox tests
        run: bun test packages/autonomous-runtime/test/inbox.test.mjs

      # The package suite still has pre-existing failures in packages that are
      # unrelated to this repository's core loop, so it is reported but does
      # not block the build.
      - name: Run package tests
        run: |
          bun test packages/ \
            || echo "package tests reported failures (non-blocking)"
