name: Auto-Merge to Main

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: auto-merge-develop
  cancel-in-progress: true

jobs:
  create-pr:
    name: Create PR to Main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --local user.email \
            "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Create PR
        id: create-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_EXISTS=$(gh pr list \
            --head develop \
            --base main \
            --state open \
            --json number \
            --jq 'length')

          if [ "$PR_EXISTS" -gt 0 ]; then
            echo "PR already exists"
            PR_NUMBER=$(gh pr list \
              --head develop \
              --base main \
              --state open \
              --json number \
              --jq '.[0].number')
            echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_OUTPUT
          else
            echo "Creating new PR..."
            gh pr create \
              --base main \
              --head develop \
              --title "chore: merge develop to main" \
              --body "Auto-generated PR to merge develop into main"
            PR_NUMBER=$(gh pr list \
              --head develop \
              --base main \
              --state open \
              --json number \
              --jq '.[0].number')
            echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_OUTPUT
            echo "Created PR #$PR_NUMBER"
          fi

      - name: Wait for CI checks to pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.create-pr.outputs.PR_NUMBER }}"
          echo "Waiting for CI checks on PR #$PR_NUMBER..."
          TIMEOUT=600
          INTERVAL=15
          ELAPSED=0
          while [ $ELAPSED -lt $TIMEOUT ]; do
            ALL_PASSING=true
            for CHECK_STATUS in $(gh pr view $PR_NUMBER \
              --json statusCheckRollup \
              --jq '.statusCheckRollup[] | .conclusion'); do
              if [ "$CHECK_STATUS" != "SUCCESS" ] && \
                 [ "$CHECK_STATUS" != "SKIPPED" ] && \
                 [ "$CHECK_STATUS" != "NEUTRAL" ]; then
                ALL_PASSING=false
                break
              fi
            done
            if [ "$ALL_PASSING" = true ]; then
              echo "All CI checks passed!"
              exit 0
            fi
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
            echo "Waited ${ELAPSED}s..."
          done
          echo "TIMEOUT: CI checks did not pass within ${TIMEOUT}s"
          exit 1

      - name: Auto-merge PR
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.create-pr.outputs.PR_NUMBER }}"
          echo "Attempting to merge PR #$PR_NUMBER..."

          MAX_RETRIES=8
          RETRY_COUNT=0
          SLEEP_BASE=8

          while [ "$RETRY_COUNT" -lt "$MAX_RETRIES" ]; do
            MERGEABLE=$(gh pr view "$PR_NUMBER" \
              --json mergeable \
              --jq '.mergeable')
            MERGE_STATE=$(gh pr view "$PR_NUMBER" \
              --json mergeStateStatus \
              --jq '.mergeStateStatus')
            HEAD_REPO_OWNER=$(gh pr view "$PR_NUMBER" \
              --json headRepositoryOwner \
              --jq '.headRepositoryOwner.login')
            HEAD_REF=$(gh pr view "$PR_NUMBER" \
              --json headRefName --jq '.headRefName')

            echo "Attempt $((RETRY_COUNT+1))/${MAX_RETRIES}"
            echo "mergeable=$MERGEABLE state=$MERGE_STATE"
            echo "headRepoOwner=$HEAD_REPO_OWNER headRef=$HEAD_REF"

            if [ "$MERGEABLE" = "UNKNOWN" ] || \
               [ "$MERGE_STATE" = "UNKNOWN" ] || \
               [ "$MERGE_STATE" = "DIRTY" ]; then
              RETRY_COUNT=$((RETRY_COUNT + 1))
              SLEEP=$((SLEEP_BASE * RETRY_COUNT))
              echo "Merge state settling; waiting ${SLEEP}s..."
              sleep $SLEEP
              continue
            fi

            if [ "$MERGEABLE" = "MERGEABLE" ]; then
              echo "PR is mergeable, performing squash merge..."
              gh pr merge "$PR_NUMBER" --squash --delete-branch=false
              exit $?
            fi

            if [ "$MERGEABLE" = "CONFLICTING" ]; then
              REPO_OWNER="${{ github.repository_owner }}"
              if [ "$HEAD_REPO_OWNER" != "$REPO_OWNER" ]; then
                echo "Fork PR with conflicts - notifying contributor"
                gh pr comment "$PR_NUMBER" --body "Auto-merge failed: this PR has conflicts with main. Please resolve locally."
                exit 1
              fi

              echo "Attempting non-interactive merge into ${HEAD_REF}..."
              git config --local user.email \
                "github-actions[bot]@users.noreply.github.com"
              git config --local user.name "github-actions[bot]"
              git fetch origin
              git checkout -b temp-merge "origin/${HEAD_REF}"
              git fetch origin main

              if git merge --no-edit origin/main; then
                echo "Local merge succeeded; pushing back..."
                git push origin "HEAD:refs/heads/${HEAD_REF}"
                MERGEABLE=$(gh pr view "$PR_NUMBER" \
                  --json mergeable --jq '.mergeable')
                if [ "$MERGEABLE" = "MERGEABLE" ]; then
                  gh pr merge "$PR_NUMBER" --squash \
                    --delete-branch=false
                  exit $?
                else
                  echo "PR still not mergeable: $MERGEABLE"
                  exit 1
                fi
              else
                echo "Merge produced conflicts; posting comment..."
                git merge --abort || true
                gh pr comment "$PR_NUMBER" --body \
                  "Conflicts exist. Please resolve locally."
                exit 1
              fi
            fi

            echo "Unexpected state: mergeable=$MERGEABLE"
            exit 1
          done

          echo "Merge state did not become ready in time"
          gh pr comment "$PR_NUMBER" --body \
            "Auto-merge timed out. Please inspect manually."
          exit 1

      - name: Report failure
        if: failure()
        run: |
          echo "Auto-merge failed. Check PR mergeability."
