name: Release

# Publishes pi-harness-runtime to npm on git tag push (e.g. v0.2.0).
#
# Also triggers on push to main branch (after auto-merge from develop).
#
# npm Trusted Publishing is enabled via GitHub Actions OIDC.
# No long-lived npm token is required in CI once each package is configured
# on npmjs.com -> Package -> Settings -> Trusted Publisher.
#
# npm Trusted Publishing is configured per package. For this monorepo, add the
# same GitHub workflow (`release.yml`) as a trusted publisher for the root
# package and each published workspace package.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (no publish)
        required: false
        default: "false"

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24" # OIDC requires Node.js 24+ for npm >= 11.5.1
          registry-url: "https://registry.npmjs.org"

      - name: Install bun
        run: npm install -g bun --allow-scripts=bun

      - name: Install dependencies
        run: |
          # Project uses bun.lock, so use bun install
          bun install

      - name: Build packages
        run: |
          bun run build

      - name: Bump version with standard-version
        run: |
          # Extract version from tag (e.g., v1.2.3 -> 1.2.3)
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Tag version: $TAG_VERSION"
          
          # Update package.json to match the tag
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const newVersion = '$TAG_VERSION';
            pkg.version = newVersion;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\\n');
            console.log('Updated version to:', newVersion);
          "
          
          # Update workspace packages to same version
          for dir in packages/*/; do
            if [ -f "$dir/package.json" ]; then
              node -e "
                const fs = require('fs');
                const pkg = JSON.parse(fs.readFileSync('$dir/package.json', 'utf8'));
                pkg.version = '$TAG_VERSION';
                fs.writeFileSync('$dir/package.json', JSON.stringify(pkg, null, 2) + '\\n');
                console.log('Updated $dir to:', '$TAG_VERSION');
              "
            fi
          done

      - name: Compute release metadata
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          TAG="latest"
          if [[ "$VERSION" == *-* ]]; then TAG="beta"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Update run name with version
        if: github.event_name == 'push'
        run: |
          # Update workflow run name to show version
          RUN_NAME="Release v${{ steps.meta.outputs.version }}"
          echo "Updating run name to: $RUN_NAME"
          echo "Run ID: $GITHUB_RUN_ID"
          echo "Repository: $GITHUB_REPOSITORY"

          # Use github context directly in the URL
          API_URL="https://api.github.com/repos/${{ github.repository }}"
          API_URL="${API_URL}/actions/runs/${{ github.run_id }}"
          curl -s -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}" \
            -d '{"name":"Release v${{ steps.meta.outputs.version }}"}' || true

      - name: Publish to npm
        if: >-
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.dry_run != 'true'
        run: |
          # OIDC handles auth automatically - no token needed
          npm publish --access public --ignore-scripts

      - name: Publish to npm (dry-run)
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.dry_run == 'true'
        run: |
          npm publish --ignore-scripts --access public --dry-run

      - name: Create GitHub Release
        if: >-
          startsWith(github.ref, 'refs/tags/v')
        # v2 has Node 20 deprecation warnings
        uses: softprops/action-gh-release@v2.0.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          prerelease: >-
            ${{ contains(steps.meta.outputs.version, '-') }}
