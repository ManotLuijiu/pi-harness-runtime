name: Release

# Publishes pi-harness-runtime to npm on git tag push (e.g. v0.2.0).
#
# Also triggers on push to main branch (after auto-merge from develop).
#
# npm Trusted Publishing is enabled via GitHub Actions OIDC.
# No long-lived npm token is required in CI once each package is configured
# on npmjs.com -> Package -> Settings -> Trusted Publisher.
#
# npm Trusted Publishing is configured per package. For this monorepo, add the
# same GitHub workflow (`release.yml`) as a trusted publisher for the root
# package and each published workspace package.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (no publish, no unpublish)
        required: false
        default: "false"
      unpublish_versions:
        description: >-
          Registry cleanup: space-separated versions to unpublish from npm
          (e.g. "1.1.390 1.1.391"). Leave empty for a normal release.
          Unpublishing deletes the tarball and cannot be undone.
        required: false
        default: ""

jobs:
  # Registry cleanup.
  #
  # npm Trusted Publishing binds a trusted publisher to a single workflow
  # filename, so this step has to live in release.yml - a separate workflow
  # file would be rejected with ENEEDAUTH. It uses the same OIDC credential
  # as the release job, so no long-lived npm token is needed.
  #
  # It runs only on a manual dispatch that names versions, and the release
  # job is skipped for such a dispatch, so a cleanup dispatch can never
  # publish.
  unpublish:
    name: Unpublish npm versions
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.unpublish_versions != ''
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24" # OIDC requires Node.js 24+ for npm >= 11.5.1
          registry-url: "https://registry.npmjs.org"

      # npm CLI only performs the OIDC exchange inside `npm publish`
      # (lib/commands/publish.js), so `npm unpublish` cannot authenticate on
      # its own. The exchange is a documented two-step protocol, so we do it
      # here and hand the resulting registry token to the CLI.
      # Reference implementation: npm/lib/utils/oidc.js
      #
      # The OIDC credential is scoped to publish operations, and npm's
      # registry rejects a packument update made with it
      # ("OIDC publish authorize: Invalid request"). Unpublishing removes a
      # version from the packument, so it needs a token with plain write
      # access. A repository token is preferred when one is configured; the
      # OIDC credential remains the fallback so the workflow still works for
      # a publisher.
      - name: Resolve a registry token
        id: cred
        env:
          PACKAGE_NAME: pi-harness-runtime
          TOK_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TOK_NPM_UNPUBLISH_TOKEN: ${{ secrets.NPM_UNPUBLISH_TOKEN }}
          TOK_NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          TOK_NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          cat > /tmp/jget.js <<'EOF'
          const fs = require("fs");
          const key = process.argv[2];
          const body = JSON.parse(fs.readFileSync(0, "utf8"));
          process.stdout.write(body[key] || "");
          EOF
          registry_token=""
          declare -A candidates=(
            [NPM_TOKEN]="$TOK_NPM_TOKEN"
            [NPM_UNPUBLISH_TOKEN]="$TOK_NPM_UNPUBLISH_TOKEN"
            [NPM_PUBLISH_TOKEN]="$TOK_NPM_PUBLISH_TOKEN"
            [NPM_AUTH_TOKEN]="$TOK_NPM_AUTH_TOKEN"
          )
          for name in "${!candidates[@]}"; do
            if [ -n "${candidates[$name]}" ]; then
              echo "credential: repository secret ${name}"
              registry_token="${candidates[$name]}"
              break
            fi
          done
          if [ -z "$registry_token" ]; then
            echo "credential: OIDC trusted publisher (publish scope only)"
            audience="npm:registry.npmjs.org"
            url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}"
            curl -sSf -H 'Accept: application/json' \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "$url" | node /tmp/jget.js value > /tmp/id_token
            id_token="$(cat /tmp/id_token)"
            if [ -z "$id_token" ]; then
              echo "no id_token returned by the GitHub OIDC endpoint" >&2
              exit 1
            fi
            exchange="https://registry.npmjs.org/-/npm/v1/oidc/token/exchange"
            exchange="${exchange}/package/${PACKAGE_NAME}"
            curl -sSf -X POST -H "Authorization: Bearer ${id_token}" \
              "$exchange" | node /tmp/jget.js token > /tmp/registry_token
            registry_token="$(cat /tmp/registry_token)"
            if [ -z "$registry_token" ]; then
              echo "the token exchange returned no registry token" >&2
              exit 1
            fi
          fi
          echo "::add-mask::${registry_token}"
          echo "token=${registry_token}" >> "$GITHUB_OUTPUT"
          # Write the literal token into an npmrc of our own. setup-node's
          # template relies on npm expanding ${NODE_AUTH_TOKEN}, and a
          # literal value removes any doubt about that expansion.
          umask 077
          printf 'registry=https://registry.npmjs.org/\n' > /tmp/npmrc
          printf '//registry.npmjs.org/:_authToken=%s\n' \
            "$registry_token" >> /tmp/npmrc
          echo "NPM_CONFIG_USERCONFIG=/tmp/npmrc" >> "$GITHUB_ENV"
          # Reading the packument proves nothing: the registry serves
          # it to an unauthenticated reader too, so a 200 here is not
          # evidence of write access. The only honest proof of write
          # access is a write, and the removal itself is that proof. The
          # credential is only identified here.
          whoami="$(npm whoami 2>&1 || true)"
          echo "credential identity: ${whoami}"
          echo "exchanged a registry token for ${PACKAGE_NAME}"

      # Report which second factor the account actually uses, so the
      # operator knows which credential can unpublish. Only booleans and
      # field names are printed - no token value, no email, no username.
      - name: Report the account's second-factor requirements
        env:
          TOK: ${{ steps.cred.outputs.token }}
          NODE_AUTH_TOKEN: ${{ steps.cred.outputs.token }}
          NPM_CONFIG_USERCONFIG: /tmp/npmrc
        run: |
          set -uo pipefail
          curl -sS -H "Authorization: Bearer ${TOK}" \
            "https://registry.npmjs.org/-/npm/v1/user" > /tmp/user.json || true
          node -e '
            const fs = require("fs");
            const raw = fs.readFileSync("/tmp/user.json", "utf8");
            let u = {};
            try { u = JSON.parse(raw); } catch {}
            console.log("user fields: " + Object.keys(u).join(", "));
            const totp = u.totp && u.totp.enabled === true;
            const web = u.webauth && u.webauth.enabled === true;
            console.log(`second factor: totp=${totp} webauth=${web}`);
            if (totp && web) {
              console.log("both factors are on: a one-time code works");
            } else if (totp) {
              console.log("an authenticator one-time code is required");
            } else if (web) {
              console.log("a browser approval is required");
            } else {
              console.log("no second factor is enabled on the account");
            }
          '
          echo "--- npm's own view ---"
          npm profile get 2>/dev/null \
            | grep -iE "two-factor|webauth|totp" \
            | sed -E "s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/<email>/g" \
            || echo "npm profile get returned no two-factor lines"

      - name: Unpublish versions
        env:
          VERSIONS: ${{ github.event.inputs.unpublish_versions }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          PACKAGE_NAME: pi-harness-runtime
          NODE_AUTH_TOKEN: ${{ steps.cred.outputs.token }}
          # An authenticator one-time code, when the account uses one.
          # It comes from a secret, never from a workflow input, so it does
          # not land in the run metadata.
          NPM_OTP: ${{ secrets.NPM_OTP }}
        run: |
          set -uo pipefail
          echo "Authenticated as: $(npm whoami 2>&1)"
          failed=""
          approval_needed=""
          for v in $VERSIONS; do
            if [ "$DRY_RUN" = "true" ]; then
              echo "DRY-RUN: would unpublish $PACKAGE_NAME@$v"
              continue
            fi
            echo "::group::unpublish $PACKAGE_NAME@$v"
            "$GITHUB_WORKSPACE/scripts/npm-unpublish-with-approval.sh" \
              request "$PACKAGE_NAME" "$v"
            rc=$?
            echo "::endgroup::"
            if [ $rc -eq 0 ]; then
              echo "OK: unpublished $PACKAGE_NAME@$v"
            elif [ $rc -eq 42 ]; then
              # The approval URL embeds credential material. A log line
              # would be masked and a run artifact would publish it, so
              # the approval cannot be completed from a public run.
              echo "The registry wants a browser approval for $v."
              echo "Run the removal on the machine instead:"
              echo "  scripts/npm-unpublish-with-approval.sh batch \\"
              echo "    $PACKAGE_NAME $v"
              approval_needed="$approval_needed $v"
              break
            else
              echo "FAILED: $PACKAGE_NAME@$v"
              failed="$failed $v"
            fi
          done
          if [ -n "$approval_needed" ]; then
            echo "Versions that need an approval:$approval_needed"
            exit 1
          fi
          if [ -n "$failed" ]; then
            echo "Versions that could not be unpublished:$failed"
            exit 1
          fi

  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    if: >-
      (github.event_name == 'workflow_dispatch' ||
       startsWith(github.ref, 'refs/tags/v')) &&
      (github.event.inputs.unpublish_versions == null ||
       github.event.inputs.unpublish_versions == '')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24" # OIDC requires Node.js 24+ for npm >= 11.5.1
          registry-url: "https://registry.npmjs.org"

      - name: Install bun
        run: npm install -g bun --allow-scripts=bun

      - name: Install dependencies
        run: |
          # Project uses bun.lock, so use bun install
          bun install

      - name: Build packages
        run: |
          bun run build

      - name: Bump version with standard-version
        run: |
          # Extract version from tag (e.g., v1.2.3 -> 1.2.3)
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Tag version: $TAG_VERSION"

          # Update package.json to match the tag
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const newVersion = '$TAG_VERSION';
            pkg.version = newVersion;
            fs.writeFileSync('package.json',
              JSON.stringify(pkg, null, 2) + '\\n');
            console.log('Updated version to:', newVersion);
          "

          # Update workspace packages to same version
          for dir in packages/*/; do
            if [ -f "$dir/package.json" ]; then
              node -e "
                const fs = require('fs');
                const pkg = JSON.parse(
                  fs.readFileSync('$dir/package.json', 'utf8')
                );
                pkg.version = '$TAG_VERSION';
                fs.writeFileSync('$dir/package.json',
                  JSON.stringify(pkg, null, 2) + '\\n');
                console.log('Updated $dir to:', '$TAG_VERSION');
              "
            fi
          done

      - name: Compute release metadata
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          TAG="latest"
          if [[ "$VERSION" == *-* ]]; then TAG="beta"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Update run name with version
        if: github.event_name == 'push'
        run: |
          # Update workflow run name to show version
          RUN_NAME="Release v${{ steps.meta.outputs.version }}"
          echo "Updating run name to: $RUN_NAME"
          echo "Run ID: $GITHUB_RUN_ID"
          echo "Repository: $GITHUB_REPOSITORY"

          # Use github context directly in the URL
          API_URL="https://api.github.com/repos/${{ github.repository }}"
          API_URL="${API_URL}/actions/runs/${{ github.run_id }}"
          curl -s -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}" \
            -d '{"name":"Release v${{ steps.meta.outputs.version }}"}' \
            || true

      # The published app is a SINGLE npm package: every internal app is
      # compiled into packages/<name>/dist and shipped inside the root
      # tarball. Verify the tarball really contains every runtime import
      # target before anything is published - a missing internal app must
      # fail the release, not ship.
      - name: Verify package contents
        run: bun run build:verify:pack

      - name: Publish to npm
        if: >-
          (github.event_name != 'workflow_dispatch' ||
           github.event.inputs.dry_run != 'true') &&
          (github.event.inputs.unpublish_versions == null ||
           github.event.inputs.unpublish_versions == '')
        run: |
          # OIDC handles auth automatically - no token needed
          # Use computed npm_tag (beta for prerelease, latest otherwise)
          npm publish --access public --ignore-scripts \
            --tag ${{ steps.meta.outputs.npm_tag }}

      - name: Publish to npm (dry-run)
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.dry_run == 'true'
        run: |
          npm publish --ignore-scripts --access public \
            --dry-run --tag ${{ steps.meta.outputs.npm_tag }}

      - name: Create GitHub Release
        if: >-
          startsWith(github.ref, 'refs/tags/v')
        # v2 has Node 20 deprecation warnings
        uses: softprops/action-gh-release@v2.0.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          prerelease: >-
            ${{ contains(steps.meta.outputs.version, '-') }}
