# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "bun" # Updates the repository's native bun.lock
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    # Compatible dependency updates have their own develop merge gate.
    # Pi API migrations and major upgrades remain under explicit review.
    target-branch: "develop"
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        update-types: [minor, patch]
        exclude-patterns: ["@earendil-works/*"]
      pi-runtime:
        patterns: ["@earendil-works/*"]
        update-types: [minor, patch]
    # These old major upgrades are tracked as explicit migrations.
    ignore:
      - dependency-name: openai
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@commitlint/cli"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore"
      include: scope
